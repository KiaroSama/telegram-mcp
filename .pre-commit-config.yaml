repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ["--count", "--select=E9,F63,F7,F82", "--show-source", "--statistics"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ["--failure-threshold", "error", "Dockerfile"]

  - repo: local
    hooks:
      - id: secret-scan
        name: refuse to publish a credential or a private path
        entry: python scripts/secret_scan.py
        language: system
        pass_filenames: false
        # pre-push, not pre-commit: a local commit is recoverable, a push to a
        # public repository is not - GitHub's own guidance is that data reaching
        # a fork cannot be removed from it by the owner or by Support.
        stages: [pre-push]
      - id: docker-compose-config
        name: docker compose config
        entry: docker compose --env-file .env.example config
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest-coverage-ci
        name: pytest with coverage (ci parity)
        entry: uv run --env-file .env.example python scripts/run_tests_guarded.py -- --cov --cov-report=term-missing --cov-report=xml
        language: system
        pass_filenames: false
        stages: [pre-push]
