name: Python Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Check Linting & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==26.5.1 flake8==7.3.0

      # No --select, --exit-zero, --max-complexity or --max-line-length: every one of
      # them overrode .flake8, and the last two contradicted pyproject's black config
      # by checking a 99-column codebase at 88 columns and then discarding the result.
      - name: Lint with Flake8
        run: flake8 . --count --show-source --statistics

      - name: Check formatting with Black
        run: |
          black --check .
