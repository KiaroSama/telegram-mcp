name: Python Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Check Linting & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # black and flake8 versions come from uv.lock, the same source every other
      # job uses. `.pre-commit-config.yaml` still carries its own `rev:` - that
      # one is pre-commit's own mechanism and only `pre-commit autoupdate` moves
      # it, so it has to be kept in step by hand.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # No --select, --exit-zero, --max-complexity or --max-line-length: every one of
      # them overrode .flake8, and the last two contradicted pyproject's black config
      # by checking a 99-column codebase at 88 columns and then discarding the result.
      - name: Lint with Flake8
        run: uv run flake8 . --count --show-source --statistics

      - name: Check formatting with Black
        run: uv run black --check .
