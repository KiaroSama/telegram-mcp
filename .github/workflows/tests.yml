name: Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Before anything resolves: is uv.lock still a lockfile FOR this pyproject?
  # Docker builds with `--frozen`, which installs whatever the lock says even
  # when the manifest has moved on - so a stale lock used to build and test
  # green while the declared dependencies said something else. `--check` is the
  # opposite question, and it is the one that catches drift.
  lock:
    name: Lockfile Matches The Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Point uv at the interpreter this job installed
        shell: bash
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Refuse a lock that no longer matches pyproject
        run: uv lock --check

      # `--locked` on every other job makes a rewrite impossible rather than
      # merely unlikely; this proves the file on disk is the file CI resolved.
      - name: Prove no step rewrote the lock
        run: git diff --exit-code -- uv.lock pyproject.toml

  test:
    name: Pytest With Coverage
    runs-on: ubuntu-latest
    # A hung decoder would otherwise hold a runner for GitHub's 6-hour default.
    # The guarded runner below bounds the run itself; this bounds the job around it.
    timeout-minutes: 20

    # The floor and the ceiling. pyproject declares >=3.11 and classifies up to
    # 3.14; running the ends is what turns that claim into evidence.
    #
    # 3.14 was added only after the suite was actually run on it, not on the
    # strength of the version being released: the resolve, every import, all 181
    # tool registrations and the full suite were checked in a throwaway 3.14 venv
    # first. That run earned its keep immediately - it caught a fragile budget in
    # test_guarded_runner (pytest's cold import costs 6.09s on 3.14 against 4.10s
    # on 3.13, and the test allowed 6.0s of silence), which 3.13 had been passing
    # on under two seconds of margin.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Without this, `uv run` reads .python-version and resolves the project's
      # own pin - so a leg labelled 3.11 installed 3.11, ran 3.13 and reported a
      # pass for an interpreter it never touched. UV_PYTHON names the exact
      # executable this leg installed, not a version range uv may satisfy some
      # other way.
      - name: Point uv at the interpreter this leg installed
        shell: bash
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      # Without the cache every push re-resolves and re-downloads the whole tree -
      # telethon, pillow, regex, plus the native rlottie wheel - once per job, on
      # two platforms. Keyed on uv.lock, so a dependency change still gets a cold
      # resolve rather than a stale environment.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # The resolver itself is a dependency of every result below. Pinned so
          # a uv release cannot change what CI resolved without a commit saying so.
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --cov-fail-under=0 overrides the floor in pyproject FOR THIS JOB. The
      # floor is a claim about the project and no single runner can execute the
      # whole project: telegram_mcp.visual.capture is Win32 and cannot run here.
      # The `coverage` job applies the floor once, to the combined data.
      # Before pytest, from inside the resolved environment. A leg that cannot
      # prove its own label is worth less than no leg, because it also hides the
      # gap it leaves in the matrix.
      - name: Prove this leg is running the interpreter it is named after
        run: uv run --locked python scripts/ci_record.py --label "py${{ matrix.python-version }}"
          --require "${{ matrix.python-version }}"

      - name: Run tests with coverage
        env:
          TELEGRAM_API_ID: "12345"
          TELEGRAM_API_HASH: "dummy_hash"
          TELEGRAM_SESSION_NAME: "test_session"
          COVERAGE_FILE: .coverage.linux-py${{ matrix.python-version }}
        run: >
          uv run --locked python scripts/run_tests_guarded.py --
          --cov --cov-report=term-missing --cov-fail-under=0
          --junitxml=junit-linux-py${{ matrix.python-version }}.xml

      # Counts, not a green tick: a leg that collected nothing passed too, and a
      # leg that lost ONE file is short by a number nothing else reports.
      - name: Record what this leg actually ran
        if: always()
        run: uv run --locked python scripts/ci_record.py --label "py${{ matrix.python-version }}"
          --require "${{ matrix.python-version }}"
          --junit "junit-linux-py${{ matrix.python-version }}.xml"
          --emit "cases/cases-linux-py${{ matrix.python-version }}.json"
          --all-suites

      - name: Upload this leg's case record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: case-record-linux-py${{ matrix.python-version }}
          path: cases/cases-linux-py${{ matrix.python-version }}.json
          if-no-files-found: error

      - name: Upload this leg's coverage data
        uses: actions/upload-artifact@v7
        with:
          # Must be unique per matrix leg: upload-artifact@v4 refuses a second
          # upload to the same name, so a static name fails the 3.13 job.
          name: coverage-data-linux-py${{ matrix.python-version }}
          path: .coverage.linux-py${{ matrix.python-version }}
          # The data file starts with a dot, and v4 drops hidden files unless
          # told otherwise - which would leave the combine step short a leg.
          include-hidden-files: true
          # An upload that found nothing is a leg that will be missing from
          # the comparison below, and the comparison cannot tell that from a
          # leg that never ran.
          if-no-files-found: error

  # The job above installs the base package, where the .tgs tests skip - which is
  # also the proof that the base install works without the optional renderer. This
  # job installs the extra so that code path is actually exercised somewhere.
  # Run on Windows as well as Linux: rlottie-python is a NATIVE optional
  # dependency, so "it installs and renders" is a per-platform fact, not a
  # per-project one — and the visual half of this fork is Windows-first, which is
  # exactly where an rlottie wheel failing to build would go unnoticed otherwise.
  lottie:
    name: Pytest With Lottie Renderer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The native rlottie decoder is exactly the kind of child that wedges
    # without exiting, so this job needs the ceiling more than the others.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The same pin as the matrix job, for the same reason: this leg is named
      # after 3.11 and must not quietly resolve the project's own.
      - name: Point uv at the interpreter this leg installed
        shell: bash
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # The resolver itself is a dependency of every result below. Pinned so
          # a uv release cannot change what CI resolved without a commit saying so.
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Prove this leg is running the interpreter it is named after
        run: uv run --locked --extra lottie python scripts/ci_record.py
          --label "lottie-${{ matrix.os }}" --require "3.11"

      - name: Fail if the lottie extra did not install
        run: >
          uv run --locked --extra lottie python -c
          "from telegram_mcp.visual.frames import lottie_available;
          assert lottie_available(), 'rlottie-python is missing: the .tgs tests would silently skip'"

      # The whole suite, not a file list. Selecting by path re-creates the exact
      # hole the guard above exists to close: a renderer-gated test added to any
      # unlisted file would run with the renderer nowhere and skip silently
      # everywhere. Running everything under the extra cannot drift.
      # Measured here too. This is the only job that runs on Windows, so it is
      # the only place the Win32 capture module executes at all - and the only
      # place the .tgs renderer does. Both belong in the combined total.
      - name: Run the whole suite with the renderer available
        env:
          TELEGRAM_API_ID: "12345"
          TELEGRAM_API_HASH: "dummy_hash"
          TELEGRAM_SESSION_NAME: "test_session"
          COVERAGE_FILE: .coverage.lottie-${{ matrix.os }}
        run: >
          uv run --locked --extra lottie python scripts/run_tests_guarded.py --
          -q --cov --cov-report= --cov-fail-under=0
          --junitxml=junit-lottie-${{ matrix.os }}.xml

      - name: Record what this leg actually ran
        if: always()
        run: uv run --locked --extra lottie python scripts/ci_record.py
          --label "lottie-${{ matrix.os }}" --require "3.11"
          --junit "junit-lottie-${{ matrix.os }}.xml"
          --emit "cases/cases-lottie-${{ matrix.os }}.json"
          --all-suites

      - name: Upload this leg's case record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: case-record-lottie-${{ matrix.os }}
          path: cases/cases-lottie-${{ matrix.os }}.json
          if-no-files-found: error

      - name: Upload this leg's coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-lottie-${{ matrix.os }}
          path: .coverage.lottie-${{ matrix.os }}
          include-hidden-files: true
          # An upload that found nothing is a leg that will be missing from
          # the comparison below, and the comparison cannot tell that from a
          # leg that never ran.
          if-no-files-found: error

  # The launchers are PowerShell and Windows-only, and nothing ran their tests
  # until now - which is how `tests/test_update_menu.ps1` was able to outlive the
  # script it tested. Discovery, not a list, for exactly that reason: a suite
  # added here is picked up, and one whose subject is deleted fails loudly.
  launchers:
    name: PowerShell Launcher Tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # test_launchers.ps1 exercises the launcher's Python tee wrapper, and falls
      # back to `python` on PATH when .venv is absent - which it is, on a runner.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run every PowerShell suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = @(Get-ChildItem -Path tests -Filter 'test_*.ps1' -File | Sort-Object Name)
          if ($suites.Count -eq 0) { throw 'No PowerShell suites found under tests/ - discovery is broken.' }
          Write-Host "Found $($suites.Count) suite(s): $(($suites.Name) -join ', ')"

          $failed = @()
          foreach ($suite in $suites) {
              Write-Host "::group::$($suite.Name)"
              & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File $suite.FullName
              $code = $LASTEXITCODE
              Write-Host '::endgroup::'
              if ($code -ne 0) { $failed += "$($suite.Name) (exit $code)" }
          }
          if ($failed.Count -gt 0) { throw "PowerShell suites failed: $($failed -join '; ')" }
          Write-Host "All $($suites.Count) PowerShell suite(s) passed."

  # A locked dependency graph is only as safe as the last time anyone looked at
  # it. Dependabot proposes upgrades; this asks the separate question of whether
  # what is pinned RIGHT NOW has a known advisory against it, transitive
  # dependencies included - which a version bump nobody has merged does not
  # answer.
  #
  # Against the exported lockfile rather than an installed environment, so the
  # answer is about what this project resolves to and not about whatever else the
  # runner happens to have. `--no-dev`: a vulnerability in a test-only tool is
  # worth knowing and is not a vulnerability in what ships.
  audit:
    name: Locked Dependencies Have No Known Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Point uv at the interpreter this job installed
        shell: bash
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export exactly what the lockfile resolves to
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt
          --output-file locked-production.txt

      # Pinned, like every other tool here: an auditor that changes underneath
      # the project turns a green run into a claim about a different checker.
      - name: Refuse a known advisory in the locked graph
        run: uvx pip-audit==2.9.0 --requirement locked-production.txt --strict --progress-spinner off

  # Every leg ran the same suite on the same commit, so they must agree on how
  # many cases exist. A dropped file is identical to success in every other
  # number - nothing goes red, the total is simply short.
  #
  # Deliberately not a stored baseline: cross-leg agreement needs no state
  # carried between runs and no number to maintain, so adding tests never breaks
  # it and losing a file on one leg always does.
  case_counts:
    name: Every Leg Collected The Same Cases
    runs-on: ubuntu-latest
    needs: [test, lottie]
    timeout-minutes: 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Every record is named after its own leg, so merge-multiple cannot lose
      # one to a basename collision - the same rule the coverage data files follow.
      - name: Collect every leg's case record
        uses: actions/download-artifact@v8
        with:
          pattern: case-record-*
          path: case-records
          merge-multiple: true

      # Two questions, one step. `--compare`: did the legs agree with each other
      # (a suite lost on ONE leg). `--suites`: is the number of tracked suites
      # still the declared one (a suite deleted on ALL of them, where every leg
      # agrees perfectly on the smaller number and the run is green).
      - name: Refuse a run missing legs, disagreeing, or dropping a suite
        run: python scripts/ci_record.py --compare case-records
          --legs .github/expected-legs.txt
          --suites .github/expected-suites.txt

  # The floor, applied once, to everything that ran.
  #
  # Neither runner can execute the whole project. telegram_mcp.visual.capture
  # is Win32 (PrintWindow) and 110 of its lines cannot run on Linux; the POSIX
  # branches of handles.py, owner_only.py and singleton.py cannot run on
  # Windows. Measured on the first CI runs this repository ever had, the same
  # commit read 85.49% on windows-latest and 81.90% on ubuntu-latest - so
  # gating either number alone gates the runner, not the suite.
  #
  # No separate 'did every leg upload' check: a missing leg takes its platform's
  # exclusive modules down to near zero, which puts the total under the floor
  # and fails right here. The floor is its own guard.
  coverage:
    name: Combined Coverage Gate
    runs-on: ubuntu-latest
    needs: [test, lottie]
    timeout-minutes: 10

    steps:
      # `coverage report` reads the source to say which lines were missed, so
      # the checkout is load-bearing here, not habit.
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # The resolver itself is a dependency of every result below. Pinned so
          # a uv release cannot change what CI resolved without a commit saying so.
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # `merge-multiple` extracts every matched artifact into ONE directory, and
      # the collision it silently loses to is on the FILE basename inside each
      # artifact, not on the artifact name. Same-named files overwrite each other,
      # a concurrent extraction can leave one half-written, and the combined
      # number comes out lower with nothing failing to say so.
      #
      # Safe here only because every leg names its data file after itself:
      # .coverage.linux-py3.11, .coverage.linux-py3.13, .coverage.lottie-ubuntu-latest,
      # .coverage.lottie-windows-latest. Do not collapse those to a constant name.
      - name: Collect every leg's coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine the platforms and apply the floor
        run: |
          uv run --locked python -m coverage combine coverage-data
          uv run --locked python -m coverage report
          uv run --locked python -m coverage xml

      - name: Upload the combined report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-combined
          path: coverage.xml
