# Nothing was watching this project's dependencies. There was no file here at
# all, so Dependabot had no version updates to run - and a FORK starts with
# Dependabot switched off regardless of this file, which is the other half of
# why no pull request ever appeared. That half is repository state, not config:
# Settings -> Code security -> Dependabot, and click enable.
version: 2

updates:
  # `pip`, not `uv`. The uv changelog announced version-update support, but the
  # supported-ecosystems table still lists only `pip` for Python, and an
  # unrecognised package-ecosystem does not fail loudly - it can invalidate the
  # whole file, which looks exactly like Dependabot not running. `pip` reads
  # pyproject.toml (this project is PEP 621) and requirements.txt together, so
  # the two stay in step and the packaging test that compares them keeps passing.
  #
  # uv.lock is NOT refreshed by this. Run `uv lock` after merging a bump.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      # Grouped so a quiet week is one pull request rather than nine. Majors stay
      # out of every group on purpose: they are the ones that need release notes
      # read and a migration considered, which cannot be done in bulk.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Four workflows run on every push, with credentials and repository write scope
  # between them. An action is a dependency like any other.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # The Dockerfile's base image. Ungrouped: a base image bump changes the whole
  # runtime underneath the application, so it is never routine.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
