# Nothing was watching this project's dependencies. There was no file here at
# all, so Dependabot had no version updates to run - and a FORK starts with
# Dependabot switched off regardless of this file, which is the other half of
# why no pull request ever appeared. That half is repository state, not config:
# Settings -> Code security -> Dependabot, and click enable.
#
# Both halves are done as of 2026-08-31: version updates are enabled on the
# repository, and the first run opened a pull request within minutes. The
# evidence that the toggle had still been off until then is that every action
# below sat three majors behind while this file asked for daily updates.
# There is no REST endpoint for that toggle - it is UI-only - so it cannot be
# asserted in CI; if Dependabot ever goes quiet for weeks, check it first.
version: 2

updates:
  # `uv`, and the reason it is not `pip` is worth writing down. The
  # supported-ecosystems table still lists only `pip` for Python, so this was
  # `pip` for a while on the theory that an unrecognised package-ecosystem could
  # invalidate the whole file. It is recognised: the uv updater is real, in
  # general availability since March 2025, and it is what keeps uv.lock in step
  # with pyproject.toml. `pip` would have left the lock this project actually
  # installs from drifting behind the manifest.
  #
  # Known limitation, worth remembering when an alert stays open: the uv updater
  # resolves through pyproject.toml, not through uv.lock, so a CVE in a
  # TRANSITIVE-only package fails with "No files have changed!" and no automated
  # fix. The manual move is `uv lock --upgrade-package <name>`; to give Dependabot
  # something it can update next time, pin a floor under
  # [tool.uv] constraint-dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      # Grouped so a quiet week is one pull request rather than nine. Majors stay
      # out of every group on purpose: they are the ones that need release notes
      # read and a migration considered, which cannot be done in bulk.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Four workflows run on every push, with credentials and repository write scope
  # between them. An action is a dependency like any other.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # The Dockerfile's base image. Ungrouped: a base image bump changes the whole
  # runtime underneath the application, so it is never routine.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
