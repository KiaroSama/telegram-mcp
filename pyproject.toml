[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mcp"
version = "2.0.1"
description = "Telegram integration for Claude via the Model Context Protocol"
readme = "README.md"
authors = [
    {name = "KiaroSama"}
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
# "Private :: Do Not Upload" is not a registered trove prefix, so PyPI rejects any
# upload carrying it. That is deliberate: the telegram-mcp name on PyPI belongs to a
# different project, and install_guard.py already refuses a PyPI-installed copy at
# import. Delete this line first if publication ever becomes intentional.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    # The floor is 3.11 because the suite needs it: tests/test_packaging.py imports
    # tomllib with no fallback. Nothing in the runtime forces it, so this is a
    # support decision - claim only what CI exercises.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.8.0,<2",
    # Image encoding/scaling for the visual capture and media preview tools.
    "pillow>=11.0",
    "python-dotenv>=1.1.0",
    # UAX #29 grapheme clusters (\X) so truncation never splits a compound
    # character; a hand-rolled scan kept missing categories.
    "regex>=2024.0.0",
    "python-json-logger>=3.3.0",
    "qrcode>=8.2",
    "telethon>=1.44.0",
]

[project.optional-dependencies]
# Required only when TELEGRAM_PROXY_TYPE is set to socks5/socks4/http.
proxy = [
    "python-socks>=2.4.3",
]
# Renders .tgs (gzipped Lottie) animated stickers and custom emoji into frames.
# Optional because it ships a native rlottie build; without it those media fall
# back to Telegram's static thumbnail or a Telegram Desktop capture.
lottie = [
    "rlottie-python>=1.3.8",
]

[project.urls]
"Homepage" = "https://github.com/KiaroSama/telegram-mcp"
"Bug Tracker" = "https://github.com/KiaroSama/telegram-mcp/issues"

[tool.setuptools]
py-modules = ["main", "sanitize", "session_string_generator"]

# Discovered rather than listed: a hand-maintained list silently drops any new
# subpackage from the wheel, and the failure only shows up as an ImportError at
# runtime on an installed copy, never in the source tree.
[tool.setuptools.packages.find]
include = ["telegram_mcp*"]
namespaces = false

[project.scripts]
telegram-mcp = "main:main"
telegram-mcp-generate-session = "session_string_generator:main"

[tool.black]
line-length = 99
target-version = ['py311']

[dependency-groups]
dev = [
    "black>=25.9.0",
    # tests/test_packaging.py builds a real wheel and imports the installed copy;
    # without these it skips, and a broken package list ships unnoticed.
    "build>=1.2",
    "flake8>=7.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "setuptools>=68",
    "wheel>=0.42",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
# What is measured: every module whose behaviour a test can pin down without a
# live Telegram connection. That is the rule - not "the fork's own modules" and
# not "anything outside tools/". telegram_mcp.media_transfer sits outside tools/
# yet is measured, because byte budgets, thumbnail selection and reference retry
# are decisions, testable against a mocked client.
#
# What stays out: the 31 telegram_mcp.tools.* adapters. They marshal arguments to
# Telethon and format what comes back, so measuring them rewards mocking the API
# rather than testing anything. Their behavioural coverage is a separate effort.
source = [
    "main",
    "sanitize",
    "session_string_generator",
    "telegram_mcp.aliases",
    "telegram_mcp.button_view",
    "telegram_mcp.client_identity",
    "telegram_mcp.connection",
    "telegram_mcp.console_theme",
    "telegram_mcp.effect_catalog",
    "telegram_mcp.file_roots",
    "telegram_mcp.install_guard",
    "telegram_mcp.media_preview",
    "telegram_mcp.media_transfer",
    "telegram_mcp.message_view",
    "telegram_mcp.runner",
    "telegram_mcp.runtime",
    "telegram_mcp.settings",
    "telegram_mcp.singleton",
    "telegram_mcp.text_fidelity",
    "telegram_mcp.visual",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A measured floor, not an aspiration. Measured 2026-08-24: 88.09% over 3626
# statements and 1270 branches on Windows, where the Win32 capture tests run.
#
# The CI job measures lower, for two reasons rather than one: it runs
# ubuntu-latest, where the genuinely Windows-only capture tests skip, AND it
# installs no optional rlottie, so every test gated on the renderer skips too.
# An external audit measured 84.52% there - below this floor - while this host
# read 88%.
# Deselecting both groups here reproduces that: 84.75% at the audited commit
# against the auditor's 84.52%, so the simulation runs ~0.2 points optimistic.
# The same simulation now reads 86.34%, putting the CI job near 86%.
# The floor stays 85 because an estimate is not a measurement: raise it only
# with a real Linux number in hand.
fail_under = 85
